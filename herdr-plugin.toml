id = "joeb454.iterm-status"
name = "iTerm Status"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Show herdr agent status in the iTerm2 tab subtitle"
platforms = ["macos"]

[[actions]]
id = "doctor"
title = "iTerm status: check setup"
contexts = ["workspace"]
# Actions run in the background, so open the checks in a popup where they can be read.
command = ["/bin/bash", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin joeb454.iterm-status --entrypoint doctor"]

[[panes]]
id = "doctor"
title = "iTerm status setup"
placement = "popup"
width = 90
height = 18
command = ["/bin/bash", "bin/doctor.sh", "--wait"]

[[startup]]
command = ["/bin/bash", "bin/update.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["/bin/bash", "bin/update.sh"]

[[events]]
on = "pane.agent_detected"
command = ["/bin/bash", "bin/update.sh"]

[[events]]
on = "pane.closed"
command = ["/bin/bash", "bin/update.sh"]

[[events]]
on = "pane.exited"
command = ["/bin/bash", "bin/update.sh"]

[[events]]
on = "tab.closed"
command = ["/bin/bash", "bin/update.sh"]

[[events]]
on = "tab.focused"
command = ["/bin/bash", "bin/update.sh"]

[[events]]
on = "workspace.closed"
command = ["/bin/bash", "bin/update.sh"]

[[events]]
on = "workspace.renamed"
command = ["/bin/bash", "bin/update.sh"]

[[events]]
on = "workspace.focused"
command = ["/bin/bash", "bin/update.sh"]
